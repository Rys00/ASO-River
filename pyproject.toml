[project]
name = "aso-river"
version = "0.1.0"
# Python 3.11/3.12 is required; 3.13+ is too new for stable legacy wheels
requires-python = ">=3.11,<3.13" 
dependencies = [
    "dotenv>=0.9.9",
    "kornia==0.7.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "torch==2.4.0",       # Lock to a known stable version
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "torchmetrics>=1.4.0",
    "wandb>=0.17.0",
]

[[tool.uv.index]]
# Switching to cu118 which has the broadest Pascal (10-series) support
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]